# Quick Start Docker Compose
# Minimal configuration for testing the newly built image

version: '3.8'

services:
  hyundai-mqtt:
    image: ghcr.io/pigmej/mqtt-hyundai-kia:latest
    container_name: hyundai-mqtt
    restart: unless-stopped
    
    environment:
      # Replace these with your actual credentials
      - HYUNDAI_USERNAME=your_email@example.com
      - HYUNDAI_PASSWORD=your_password
      - HYUNDAI_PIN=your_pin
      - HYUNDAI_REGION=1
      - HYUNDAI_BRAND=1
      - MQTT_BROKER_HOST=your_mqtt_broker
      - MQTT_BROKER_PORT=1883
      - LOG_LEVEL=INFO
      - INITIAL_REFRESH=true
      - REFRESH_INTERVAL=60