# Docker Compose Example - Production Deployment
# This file demonstrates how to run the newly built Docker image
# from GitHub Container Registry (GHCR)

version: '3.8'

services:
  hyundai-mqtt:
    # Use the image built and published via GitHub Actions
    image: ghcr.io/pigmej/mqtt-hyundai-kia:latest
    
    # Container name for easy reference
    container_name: hyundai-mqtt
    
    # Restart policy for production reliability
    restart: unless-stopped
    
    # Environment variables - replace with your actual credentials
    environment:
      # Required: Hyundai/Kia/Genesis credentials
      - HYUNDAI_USERNAME=your_email@example.com
      - HYUNDAI_PASSWORD=your_password
      - HYUNDAI_PIN=your_vehicle_pin
      
      # Required: MQTT broker configuration
      - MQTT_BROKER_HOST=your_mqtt_broker_host
      - MQTT_BROKER_PORT=1883
      
      # Optional: Hyundai API configuration
      - HYUNDAI_REGION=1        # 1=Europe, 2=Canada, 3=USA
      - HYUNDAI_BRAND=2         # 1=Kia, 2=Hyundai, 3=Genesis
      
      # Optional: MQTT authentication (if your broker requires it)
      # - MQTT_USERNAME=your_mqtt_username
      # - MQTT_PASSWORD=your_mqtt_password
      
      # Optional: Application configuration
      - LOG_LEVEL=INFO          # DEBUG, INFO, WARNING, ERROR
      - INITIAL_REFRESH=true     # Load cached data on startup
      - REFRESH_INTERVAL=60     # Default refresh interval in seconds
      - MQTT_BASE_TOPIC=hyundai # Base topic for MQTT messages
    
    # Optional: Volume mounts for persistent data or logs
    # volumes:
    #   - ./logs:/app/logs
    #   - ./data:/app/data
    
    # Optional: Custom network configuration
    # networks:
    #   - mqtt-network
    
    # Optional: Resource limits for production
    # deploy:
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '0.5'
    #     reservations:
    #       memory: 128M
    #       cpus: '0.25'

# Optional: Custom network configuration
# networks:
#   mqtt-network:
#     driver: bridge
#     ipam:
#       config:
#         - subnet: 172.20.0.0/16

# Optional: Named volumes for persistent data
# volumes:
#   logs:
#     driver: local
#   data:
#     driver: local